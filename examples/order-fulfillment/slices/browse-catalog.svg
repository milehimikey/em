<svg width="247pt" height="528pt"
 viewBox="0.00 0.00 247.00 528" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="em-arrow-3C4043" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3C4043"/></marker><marker id="em-arrow-2B6CB0" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#2B6CB0"/></marker></defs><metadata id="em-slices">{"slices":[{"index":0,"name":"Browse Catalog","x0":96.63,"x1":240.63,"docHtml":"&lt;h1&gt;Slice: Browse Catalog&lt;/h1&gt;\n&lt;p&gt;&lt;img src=\"browse-catalog.svg\" alt=\"Diagram\"&gt;&lt;/p&gt;\n&lt;h2&gt;Intent&lt;/h2&gt;\n&lt;p&gt;A shopper has picked items from the product catalog and wants to commit to buying them.\nThis is the entry point of the whole fulfillment story — every later slice (payment,\nreceipt) exists because this one happened first. Originating ticket: MIL-60.&lt;/p&gt;\n&lt;h2&gt;Trigger &amp;amp; Actor&lt;/h2&gt;\n&lt;p&gt;A &lt;code&gt;Customer&lt;/code&gt;, acting on the &lt;strong&gt;Product Catalog&lt;/strong&gt; screen.&lt;/p&gt;\n&lt;h2&gt;Command / Input&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;Command:&lt;/strong&gt; &lt;code&gt;Place Order&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Field&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Required&lt;/th&gt;\n&lt;th&gt;Rules / Validation&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;&lt;tr&gt;\n&lt;td&gt;customerId&lt;/td&gt;\n&lt;td&gt;UUID&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;Must resolve to an active, non-suspended customer account.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;items&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;LineItem[]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;At least one line item; each item&amp;#39;s &lt;code&gt;productId&lt;/code&gt; must exist and be in stock at command time (stock is re-checked, not just at add-to-cart time).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;total&lt;/td&gt;\n&lt;td&gt;Money&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;Must equal the sum of &lt;code&gt;items[].unitPrice * quantity&lt;/code&gt; — the server recomputes and rejects a mismatched client-supplied total rather than trusting it.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;&lt;/table&gt;\n&lt;h2&gt;Trigger&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;Triggered by:&lt;/strong&gt; screen &lt;code&gt;Product Catalog&lt;/code&gt; @Customer&lt;/p&gt;\n&lt;h2&gt;Event(s) Emitted&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;Event:&lt;/strong&gt; &lt;code&gt;Order Placed&lt;/code&gt; → context &lt;code&gt;Order&lt;/code&gt;\n&lt;strong&gt;Read by:&lt;/strong&gt; &lt;code&gt;Open Orders&lt;/code&gt;, in the &lt;strong&gt;View Open Orders&lt;/strong&gt; slice.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Field&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Immutable Fact?&lt;/th&gt;\n&lt;th&gt;Source / Notes&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;&lt;tr&gt;\n&lt;td&gt;orderId&lt;/td&gt;\n&lt;td&gt;UUID&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;Server-generated at decision time — never supplied by the command (this is why &lt;code&gt;em validate&lt;/code&gt; flags it as a field-completeness warning; it&amp;#39;s the documented &amp;quot;system supplies this&amp;quot; case, not a gap).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;customerId&lt;/td&gt;\n&lt;td&gt;UUID&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;Copied from the command.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;total&lt;/td&gt;\n&lt;td&gt;Money&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;Copied from the command (already server-validated above).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;placedAt&lt;/td&gt;\n&lt;td&gt;Instant&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;Server clock at decision time — same system-generated shape as &lt;code&gt;orderId&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;&lt;/table&gt;\n&lt;h2&gt;Invariants / Business Rules&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;INV-BC-1:&lt;/strong&gt; An order&amp;#39;s &lt;code&gt;total&lt;/code&gt; must equal the sum of its line items&amp;#39; &lt;code&gt;unitPrice * quantity&lt;/code&gt;\nat order time.&lt;ul&gt;\n&lt;li&gt;Violation ⇒ rejection, no event.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;INV-BC-2:&lt;/strong&gt; Every line item&amp;#39;s product must be in stock at the moment &lt;code&gt;Place Order&lt;/code&gt; is\nhandled (checked then, not reserved earlier).&lt;ul&gt;\n&lt;li&gt;A race against another shopper&amp;#39;s concurrent order is a legitimate rejection, not a bug.&lt;/li&gt;\n&lt;li&gt;An order that fails this check is rejected outright; it never emits &lt;code&gt;Order Placed&lt;/code&gt;, and\nthere is no separate &amp;quot;rejected&amp;quot; event for it.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;INV-BC-3:&lt;/strong&gt; &lt;code&gt;Place Order&lt;/code&gt; is not idempotent.&lt;ul&gt;\n&lt;li&gt;Each accepted call records a new order, even with identical content to a prior call —\nde-duplicating a doubled submit is the client&amp;#39;s job (disable the button on submit), not\nthis command&amp;#39;s.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Scenarios (Given / When / Then)&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Happy path&lt;/strong&gt;&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Given:&lt;/strong&gt; an active customer and a cart of in-stock items whose prices sum to the\ndeclared total&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;When:&lt;/strong&gt; &lt;code&gt;Place Order&lt;/code&gt; is issued&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Then:&lt;/strong&gt; &lt;code&gt;Order Placed&lt;/code&gt; is recorded and the order becomes visible in &lt;strong&gt;Open Orders&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Rejected (INV-BC-1)&lt;/strong&gt;&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Given:&lt;/strong&gt; a cart whose declared &lt;code&gt;total&lt;/code&gt; doesn&amp;#39;t match the sum of its line items&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;When:&lt;/strong&gt; &lt;code&gt;Place Order&lt;/code&gt; is issued&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Then:&lt;/strong&gt; rejected with a total-mismatch error; no event.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Rejected (INV-BC-2)&lt;/strong&gt;&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Given:&lt;/strong&gt; a line item that just sold out&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;When:&lt;/strong&gt; &lt;code&gt;Place Order&lt;/code&gt; is issued&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Then:&lt;/strong&gt; rejected with an out-of-stock error naming the item; no event.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Alternate &amp;amp; Error Flows&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Idempotency: the catalog UI may retry a failed submit. &lt;code&gt;Place Order&lt;/code&gt; is not itself\nidempotent on repeat calls with identical content — that&amp;#39;s the open question below.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Non-Functional Requirements&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Security / authz:&lt;/strong&gt; the customer must be authenticated; &lt;code&gt;customerId&lt;/code&gt; is taken from the\nsession, never from client input, even though the field table above shows it as part of\nthe command shape.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;PII &amp;amp; compliance:&lt;/strong&gt; none beyond the customer&amp;#39;s own account linkage — no payment data\nis captured in this slice.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Performance / SLA:&lt;/strong&gt; none.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Dependencies &amp;amp; Read Models Affected&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Upstream events this slice relies on:&lt;/strong&gt; none — this is the first slice in the story.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Downstream read models / slices affected:&lt;/strong&gt; &lt;strong&gt;View Open Orders&lt;/strong&gt; (projects &lt;code&gt;Order Placed&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Open Questions&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;input checked=\"\" disabled=\"\" type=\"checkbox\"&gt; Should a placed order reserve stock immediately, or only on payment capture? — resolved: neither reserves it; INV-BC-2 checks stock at order time and lets a later concurrent order legitimately win the race. — source: notes/order-placed.md&lt;/li&gt;\n&lt;li&gt;&lt;input checked=\"\" disabled=\"\" type=\"checkbox\"&gt; Does an order placed with an out-of-stock item still emit this event, or a separate &lt;code&gt;Order Rejected&lt;/code&gt;? — resolved: it&amp;#39;s rejected outright (INV-BC-2); no event of any kind. — source: notes/order-placed.md&lt;/li&gt;\n&lt;li&gt;&lt;input checked=\"\" disabled=\"\" type=\"checkbox\"&gt; Is a retried &lt;code&gt;Place Order&lt;/code&gt; with identical content idempotent, or does every submit record a new order? — resolved: not idempotent (INV-BC-3); de-duplication is a client concern.&lt;/li&gt;\n&lt;/ul&gt;\n"}],"rowLabels":{"x0":-5.369999999999997,"x1":82.63}}</metadata><style>.em-slice-dim{opacity:.15;transition:opacity .15s ease}</style>
