# System manifest (schema 2.0, MIL-235) — which models make up this system; `em system` resolves
# every translation's `consumes` ref against them. Keys under `models:` are each model's key (the
# kebab-slug of its declared `model "..."` name); `source` paths resolve relative to this file and
# may be `.em` files or `em export --json` documents. Seams and owners live in the models.
systemSchemaVersion: "2.0"
name: Multi-model example
models:
  checkout:
    source: models/checkout/checkout.em
  fulfillment:
    source: models/fulfillment/fulfillment.em

# `checkout:cancel-order/event.order-cancelled` is deliberately consumed by nothing so this
# example's `em system` run shows a `dangling-public-event` warning beside its one verified seam.
