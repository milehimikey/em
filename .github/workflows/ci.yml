name: CI

# MIL-92: this repo's first CI workflow. build-test covers gates 1 (skill doctest,
# test/skillExamples.test.ts) and 2 (generated skill-doc drift, test/skillDocsGenerated.test.ts)
# as ordinary `npm test` assertions — no extra steps needed for those. skill-version-stamp is
# gate 3's release gate: it needs a PR base revision to diff against, so it only runs on
# pull_request (a direct push to main has no PR base and must not fail the job that isn't
# applicable to it).
#
# MIL-216: `npm test` above runs in the runner's default UTC. A test that computes an expected
# "today" from `toISOString().slice(0, 10)` instead of `localIsoDate()` reads the same instant
# either way and never fails here — it only diverges on a contributor's machine, west of UTC,
# after ~17:00 local (see docs/architecture.md "Testing conventions"). The extra step below
# reruns the date-sensitive files under a west-of-UTC zone so that divergence is reproducible on
# the runner too; test/noUtcToday.test.ts is the static guard against the pattern recurring.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: date-sensitive tests, west-of-UTC zone (MIL-216)
        run: TZ=America/Denver npx vitest run test/cli-state.test.ts test/cli.test.ts -t "today|mechanical fields|writes the exact format"

  skill-version-stamp:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:skill-version -- --from "${{ github.event.pull_request.base.sha }}"
